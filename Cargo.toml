[package]
name = "sporeflower"
version = "0.1.0"
edition = "2024"
autotests = false
rust-version = "1.88"
description = "A native decompiler for J2ME-era Java bytecode"
license = "Apache-2.0"

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
needless_collect = "warn"
redundant_clone = "warn"
format_push_string = "warn"
format_collect = "warn"

[features]
mimalloc = ["dep:mimalloc"]

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
self_cell = "1.3"
unicode-general-category = "1"
unicode-normalization = "0.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
clap = { version = "4.6", features = ["derive"] }
mimalloc = { version = "0.1.52", optional = true }
rayon = "1.12"
tempfile = "3.27"
toml = { version = "1.2", default-features = false, features = ["std", "parse", "serde", "display"] }
zip = { version = "9.4", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[build-dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
# strip = "symbols" # Smaller binary, without diagnostic function names.

[[bin]]
name = "sporeflower"
path = "src/main.rs"

[[test]]
name = "integration"
path = "tests/integration.rs"
