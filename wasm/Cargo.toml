[package]
name = "sporeflower-wasm"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Browser WebAssembly boundary for the Sporeflower J2ME decompiler"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sporeflower = { path = "..", default-features = false }
serde_json = "1.0"
wasm-bindgen = "=0.2.130"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Os", "--strip-debug", "--strip-producers"]

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
