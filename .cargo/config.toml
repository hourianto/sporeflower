[env]
# Mimalloc's arena sizes are in KiB: 64 MiB reserve, 512 KiB object limit.
# Linux THP inflates resident memory. The purge delay is set at CLI startup.
CFLAGS = "-DMI_DEFAULT_ARENA_RESERVE=65536 -DMI_DEFAULT_ARENA_MAX_OBJECT_SIZE=512 -DMI_DEFAULT_ALLOW_THP=0"
CXXFLAGS = "-DMI_DEFAULT_ARENA_RESERVE=65536 -DMI_DEFAULT_ARENA_MAX_OBJECT_SIZE=512 -DMI_DEFAULT_ALLOW_THP=0"
