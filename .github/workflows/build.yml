name: Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency: release

env:
  STATUS: snapshot

jobs:
  release:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04

    steps:
      - name: Check out sources
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Java
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic

      - name: Build release files
        run: ./gradlew jar :toolkit:distZip --stacktrace

      - name: Update the continuous prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/libs/sporeflower-*-SNAPSHOT.jar sporeflower.jar
          cp toolkit/build/distributions/j2me-*-SNAPSHOT.zip j2me.zip
          git tag --force continuous "$GITHUB_SHA"
          git push --force origin refs/tags/continuous

          notes="Development build from commit $GITHUB_SHA."

          if gh release view continuous >/dev/null 2>&1; then
            gh release upload continuous sporeflower.jar j2me.zip --clobber
            gh release edit continuous \
              --title "Continuous development build" \
              --notes "$notes" \
              --prerelease
          else
            gh release create continuous sporeflower.jar j2me.zip \
              --verify-tag \
              --title "Continuous development build" \
              --notes "$notes" \
              --prerelease \
              --latest=false
          fi
